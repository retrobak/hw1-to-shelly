version: "3.9"
services:
  shelly-emulator:
    build: .
    container_name: shelly-emulator
    environment:
      - HOMEWIZARD_HOST=192.168.2.218   # <-- aanpassen
      - POLL_INTERVAL=2
      - HTTP_PORT=8080
      - DEVICE_NAME=ShellyEM-EMU
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    restart: unless-stopped
